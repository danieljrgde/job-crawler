[project]
name = "job-crawler"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_crawler"]



# ------------------------------ #
# --- RUFF --------------------- #
# ------------------------------ #

[tool.ruff]

exclude = [
    "**/migrations/*",
]

# Params
line-length = 128
indent-width = 4
target-version = "py312"
cache-dir = ".cache/ruff"

# --- LINT --------------------- #

[tool.ruff.lint]

# Rules selection
select = ["ALL"]
ignore = [

    # Flake8-annotations (ANN)
    "ANN001",   # Missing type annotation for function argument
    "ANN002",   # Missing type annotation for *{name}
    "ANN003",   # Missing type annotation for **{name}
    "ANN201",   # Missing return type annotation for public function
    "ANN204",   # Missing return type annotation for special method

    # Warning (W)
    "W191",     # Indentation contains tabs

    # Pydocstyle (D)
    "D100",     # Missing docstring in public module
    "D101",     # Missing docstring in public class
    "D102",     # Missing docstring in public method
    "D103",     # Missing docstring in public function
    "D104",     # Missing docstring in public package
    "D107",     # Missing docstring in __init__
    "D203",     # 1 blank line required before class docstring
    "D206",     # Docstring should be indented with spaces, not tabs
    "D213",     # Multi-line docstring summary should start at the second line
    "D407",     # Missing dashed underline after section ("{name}")
    "D408",     # Section underline should be in the line following the section's name ("{name}")

    # Pylint (PLC)
    "PLC0414",  # Import alias does not rename original package (needed for explicit re-exports)

    # Flake8-bandit (S)
    "S106",     # Hardcoded password in function argument (false positive on board_token)

    # flake8-implicit-str-concat / namespace
    "INP001",   # Implicit namespace package (tests/ has no __init__.py intentionally)

    # flake8-async (ASYNC)
    "ASYNC109", # Async function with timeout parameter (used correctly via aiohttp.ClientTimeout)

    # flake8-commas (COM)
    "COM812",   # Trailing comma missing (conflicts with ruff formatter)

]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

per-file-ignores = {"tests/**/*.py" = ["S101"]}

# --- FORMAT ------------------- #

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"